[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SITE_URL = "https://dental-assisting-toronto.ca"

[dev]
  command = "npm run dev"
  targetPort = 8080

# Canonical host: apex (no www)
[[redirects]]
  from = "https://www.dental-assisting-toronto.ca/*"
  to = "https://dental-assisting-toronto.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dental-assisting-toronto.ca/"
  to = "https://dental-assisting-toronto.ca/"
  status = 301
  force = true

# Legacy FAQ path
[[redirects]]
  from = "/faq"
  to = "/dental-assisting-college-faq"
  status = 301
  force = true

# Note: do NOT add /contact/ → /contact style redirects here.
# With force=true they can match both slash and no-slash URLs on Netlify
# and create an infinite 301 loop (deep links fail; in-app clicks still work).
# Trailing slashes are handled by TanStack Router (trailingSlash: "never").
